# kind-cluster.yaml - 3-node cluster for DSO202 practicals
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dso202                 # context will be "kind-dso202"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # NodePort inside the cluster
        hostPort: 30080      # port on your machine (localhost:30080)
        protocol: TCP
  - role: worker
  - role: worker
