# =============================================================================
# File        : manifests/10-ingress.yaml
# Assignment  : DSO202 Assignment 2
# Namespace   : dso202-assignment-02
# Target      : Traefik Ingress Controller
# Purpose     : Route external HTTP traffic to frontend-svc and backend-svc.
#
# Apply with  : kubectl apply -f manifests/10-ingress.yaml
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    dso202/assignment: "02"
    dso202/managed-by: declarative
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # --- Backend API Route ---
          # Forwards /api requests to backend-svc on port 8080.
          # Express app handles /api/status and /api/tasks directly.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080

          # --- Frontend Route ---
          # Forwards all other requests to frontend-svc on port 8080.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 8080