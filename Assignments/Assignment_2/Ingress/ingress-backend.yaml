apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dso202-backend-ingress
  namespace: dso202-assignment-02
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dso202-assignment-02-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080