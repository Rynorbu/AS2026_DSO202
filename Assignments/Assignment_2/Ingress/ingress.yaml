apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dso202-ingress
  namespace: dso202-assignment-02
  labels:
    dso202/assignment: "02"
    dso202/managed-by: declarative
  annotations:
    # Traefik-specific annotations (controller-specific features)
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dso202-assignment-02-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ranjung.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 8080
    - host: api.ranjung.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
