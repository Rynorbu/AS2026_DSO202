apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dso202-assignment-02
  labels:
    app: frontend
    tier: frontend
    dso202/assignment: "02"
    dso202/managed-by: declarative
spec:
  type: ClusterIP

  selector:
    app: frontend

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP