apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: dso202-assignment-02
  labels:
    app: frontend
    tier: frontend
    dso202/assignment: "02"
    dso202/managed-by: declarative
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
        dso202/assignment: "02"
        dso202/managed-by: declarative
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: frontend
          image: rynorbu11/dso202-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BACKEND_URL

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"