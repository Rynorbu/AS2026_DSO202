apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  # hostPort 80 can only be bound by one pod per node, so the old pod must be
  # removed before the new one starts (a RollingUpdate would deadlock).
  strategy:
    type: Recreate
    rollingUpdate: null           # clear the old RollingUpdate defaults on apply
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik

      # kind only publishes host port 80 on the control-plane node.
      # (The nginx controller failed earlier with "didn't match Pod's node
      # affinity/selector" because it expects an ingress-ready=true label.)
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            # Shown in the ADDRESS column of 'kubectl get ingress'
            - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
            - --providers.kubernetescrd=true
            - --entrypoints.web.address=:8000
            - --api.dashboard=true
            - --api.insecure=true          # dashboard on :8080 (lab use only)
            - --ping=true
            - --log.level=INFO
            - --accesslog=true
          ports:
            - name: web
              containerPort: 8000
              hostPort: 80
            - name: dashboard
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: dashboard
      port: 8080
      targetPort: dashboard
