apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dso202-assignment-02
data:
  # Stable network identity of the first StatefulSet pod: <pod>.<headless-svc>
  DB_HOST: "db-0.db-svc"
  DB_PORT: "5432"
  DB_NAME: "tasksdb"
  APP_PORT: "8080"
  CORS_ORIGIN: "*"
  BACKEND_URL: "http://backend-svc:8080"

  POSTGRES_DB: "tasksdb"
  # Data goes in a sub-folder so the volume root's lost+found doesn't break initdb
  PGDATA: "/var/lib/postgresql/data/pgdata"